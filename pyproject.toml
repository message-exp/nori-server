[project]
name = "nori-server"
version = "0.1.1"
description = "A Python implementation of Nori server."
authors = []
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "grpcio-tools (>=1.69.0,<2.0.0)",
    "snowflake-id (>=1.0.2,<2.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "sqlmodel (>=0.0.22,<0.0.23)",
    "alembic (>=1.14.1,<2.0.0)",
    "sqlalchemy (>=2.0.37,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "sqlalchemy-utils (>=0.41.2,<0.42.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "grpcio-reflection (>=1.70.0,<2.0.0)"
]

[project.optional-dependencies]
dev = [
    "mypy (>=1.14.1,<2.0.0)",
    "ruff (>=0.9.1,<0.10.0)",
    "protoletariat (>=3.3.8,<4.0.0)",
    "types-protobuf (>=5.29.1.20241207,<6.0.0.0)",
    "pytest (>=8.3.4,<9.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
    "pytest-asyncio (>=0.25.3,<0.26.0)",
    "pytest-mock (>=3.14.0,<4.0.0)"
]

[tool.poetry]
package-mode = false

[tool.ruff]
extend-exclude = ["src/proto_generated/*"]

[tool.ruff.lint]
# default + flake8-annotations(ANN)
select = ["E4", "E7", "E9", "F", "ANN"]

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
