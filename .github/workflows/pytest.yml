name: Pytest
on: [pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: 'poetry'
      - name: Set up PostgreSQL
        run: |
          # Load environment variables from .env.sample
          set -a
          source ../.env.sample
          set +a
          # Start PostgreSQL container using environment variables from .env.sample
          docker run --name postgres -e POSTGRES_USER=$POSTGRES_USER -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD -e POSTGRES_DB=$POSTGRES_DB -p $POSTGRES_PORT:$POSTGRES_PORT -d postgres:latest
          echo "Waiting for PostgreSQL to be ready..."
          # Poll for database readiness up to 30 seconds
          for i in {1..30}; do
            docker exec postgres pg_isready -U $POSTGRES_USER && break || sleep 1
          done
          docker exec postgres pg_isready -U $POSTGRES_USER || (echo "PostgreSQL not ready" && exit 1)
      - name: Install poetry
        uses: abatilo/actions-poetry@v4
      - name: Install dependencies
        run: poetry install --extras dev
      - name: Test with pytest
        run: pytest
