name: Ruff
on: [pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff-action
        uses: astral-sh/ruff-action@v1
      - name: ruff-action format
        uses: astral-sh/ruff-action@v1
        with:
          args: "format --check"
